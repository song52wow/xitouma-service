name: Deploy Backend to Aliyun ECS

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: aliyun-ecs-backend
  cancel-in-progress: true

env:
  DEPLOY_PATH: ${{ vars.ECS_DEPLOY_PATH || '/opt/xitouma-backend' }}
  COMPOSE_PROJECT_NAME: ${{ vars.ECS_COMPOSE_PROJECT || 'xitouma-backend' }}
  ECS_PORT: ${{ secrets.ALIYUN_ECS_PORT || '22' }}
  APP_HOST_PORT: ${{ vars.ECS_APP_PORT || '3001' }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build backend
        run: npm run build

      - name: Validate deployment configuration
        env:
          ECS_ENV_PRODUCTION: ${{ secrets.ECS_ENV_PRODUCTION }}
          ALIYUN_ECS_HOST: ${{ secrets.ALIYUN_ECS_HOST }}
          ALIYUN_ECS_USER: ${{ secrets.ALIYUN_ECS_USER }}
          ALIYUN_ECS_SSH_KEY: ${{ secrets.ALIYUN_ECS_SSH_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WECHAT_SECRET: ${{ secrets.WECHAT_SECRET }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          WECHAT_APPID: ${{ vars.WECHAT_APPID }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
        run: |
          missing=()

          test -n "$ALIYUN_ECS_HOST" || missing+=("Secret: ALIYUN_ECS_HOST")
          test -n "$ALIYUN_ECS_USER" || missing+=("Secret: ALIYUN_ECS_USER")
          test -n "$ALIYUN_ECS_SSH_KEY" || missing+=("Secret: ALIYUN_ECS_SSH_KEY")

          if [ -z "$ECS_ENV_PRODUCTION" ]; then
            test -n "$POSTGRES_PASSWORD" || missing+=("Secret: POSTGRES_PASSWORD")
            test -n "$JWT_SECRET" || missing+=("Secret: JWT_SECRET")
            test -n "$WECHAT_SECRET" || missing+=("Secret: WECHAT_SECRET")
            test -n "$POSTGRES_USER" || missing+=("Variable: POSTGRES_USER")
            test -n "$POSTGRES_DB" || missing+=("Variable: POSTGRES_DB")
            test -n "$WECHAT_APPID" || missing+=("Variable: WECHAT_APPID")
            test -n "$CORS_ORIGIN" || missing+=("Variable: CORS_ORIGIN")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing GitHub Actions configuration:"
            printf '  - %s\n' "${missing[@]}"
            echo ""
            echo "Expected layout:"
            echo "  Secrets: POSTGRES_PASSWORD, JWT_SECRET, WECHAT_SECRET, WEATHER_API_KEY (optional)"
            echo "  Variables: POSTGRES_USER, POSTGRES_DB, WECHAT_APPID, CORS_ORIGIN, ..."
            echo "  Legacy: secret ECS_ENV_PRODUCTION (full .env.production file)"
            exit 1
          fi

      - name: Package source
        run: git archive --format=tar.gz --output=/tmp/xitouma-backend.tar.gz HEAD

      - name: Prepare SSH
        env:
          ALIYUN_ECS_HOST: ${{ secrets.ALIYUN_ECS_HOST }}
          ALIYUN_ECS_USER: ${{ secrets.ALIYUN_ECS_USER }}
          ALIYUN_ECS_SSH_KEY: ${{ secrets.ALIYUN_ECS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$ALIYUN_ECS_SSH_KEY" > ~/.ssh/aliyun_ecs
          sed -i 's/\r$//' ~/.ssh/aliyun_ecs
          chmod 600 ~/.ssh/aliyun_ecs

          if ! ssh-keygen -y -f ~/.ssh/aliyun_ecs > /tmp/aliyun_ecs.pub 2>/dev/null; then
            echo "::error::ALIYUN_ECS_SSH_KEY is not a valid private key."
            echo "Paste the full key, including -----BEGIN ... PRIVATE KEY----- lines."
            exit 1
          fi

          echo "Derived public key fingerprint (must match ECS authorized_keys):"
          ssh-keygen -lf /tmp/aliyun_ecs.pub
          echo "Expected on ECS: SHA256:BOggCXrPSLhv5F2ANFxXKGq41CFVyukkgkbn60s/nFI (github-actions-deploy)"

          ssh-keyscan -p "$ECS_PORT" -H "$ALIYUN_ECS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test SSH connection
        env:
          ALIYUN_ECS_HOST: ${{ secrets.ALIYUN_ECS_HOST }}
          ALIYUN_ECS_USER: ${{ secrets.ALIYUN_ECS_USER }}
        run: |
          ssh -i ~/.ssh/aliyun_ecs -p "$ECS_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            "$ALIYUN_ECS_USER@$ALIYUN_ECS_HOST" "echo ssh-ok && whoami && mkdir -p '$DEPLOY_PATH/releases' '$DEPLOY_PATH/shared'"

      - name: Write production env
        env:
          ECS_ENV_PRODUCTION: ${{ secrets.ECS_ENV_PRODUCTION }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WECHAT_SECRET: ${{ secrets.WECHAT_SECRET }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          WECHAT_APPID: ${{ vars.WECHAT_APPID }}
          WECHAT_JSCODE2SESSION_URL: ${{ vars.WECHAT_JSCODE2SESSION_URL }}
          DEFAULT_TIMEZONE: ${{ vars.DEFAULT_TIMEZONE }}
          BACKFILL_WINDOW_DAYS: ${{ vars.BACKFILL_WINDOW_DAYS }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
        run: node scripts/render-production-env.mjs /tmp/.env.production

      - name: Upload release files
        env:
          ALIYUN_ECS_HOST: ${{ secrets.ALIYUN_ECS_HOST }}
          ALIYUN_ECS_USER: ${{ secrets.ALIYUN_ECS_USER }}
        run: |
          ssh -i ~/.ssh/aliyun_ecs -p "$ECS_PORT" "$ALIYUN_ECS_USER@$ALIYUN_ECS_HOST" \
            "mkdir -p '$DEPLOY_PATH/releases/${GITHUB_SHA}' '$DEPLOY_PATH/shared'"
          scp -i ~/.ssh/aliyun_ecs -P "$ECS_PORT" /tmp/xitouma-backend.tar.gz \
            "$ALIYUN_ECS_USER@$ALIYUN_ECS_HOST:$DEPLOY_PATH/releases/${GITHUB_SHA}/source.tar.gz"
          scp -i ~/.ssh/aliyun_ecs -P "$ECS_PORT" /tmp/.env.production \
            "$ALIYUN_ECS_USER@$ALIYUN_ECS_HOST:$DEPLOY_PATH/shared/.env.production"

      - name: Deploy on ECS
        env:
          ALIYUN_ECS_HOST: ${{ secrets.ALIYUN_ECS_HOST }}
          ALIYUN_ECS_USER: ${{ secrets.ALIYUN_ECS_USER }}
        run: |
          ssh -i ~/.ssh/aliyun_ecs -p "$ECS_PORT" "$ALIYUN_ECS_USER@$ALIYUN_ECS_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' RELEASE_ID='${GITHUB_SHA}' COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' APP_HOST_PORT='$APP_HOST_PORT' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          cd "$DEPLOY_PATH"
          tar -xzf "releases/$RELEASE_ID/source.tar.gz" -C "releases/$RELEASE_ID"
          cp shared/.env.production "releases/$RELEASE_ID/.env.production"
          ln -sfn "releases/$RELEASE_ID" current

          cd current
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.prod.yml up -d --build --remove-orphans
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.prod.yml ps

          sleep 8
          curl -fsS "http://127.0.0.1:${APP_HOST_PORT}/health"

          cd "$DEPLOY_PATH"
          find releases -mindepth 1 -maxdepth 1 -type d | sort | head -n -5 | xargs -r rm -rf
          docker image prune -f
          REMOTE_SCRIPT
