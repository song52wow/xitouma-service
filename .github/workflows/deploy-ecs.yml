name: Deploy Backend to Aliyun ECS

# Image build runs in Aliyun ACR (code push auto-build). This workflow resolves
# IMAGE_TAG from the push (release tag or main branch), waits for ACR, then deploys.
# See docs/acr-autobuild.md.

on:
  push:
    branches:
      - main
      - master
    tags:
      - release-v*
  workflow_dispatch:
    inputs:
      image_tag:
        description: Override ACR image tag to deploy
        required: false
        type: string

concurrency:
  group: aliyun-ecs-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  ACR_REGISTRY: crpi-df6i5zrps8a8t6ig.cn-shenzhen.personal.cr.aliyuncs.com
  IMAGE_NAME: song52wow/xitouma-service
  DEPLOY_PATH: ${{ vars.ECS_DEPLOY_PATH || '/opt/xitouma-backend' }}
  COMPOSE_PROJECT_NAME: ${{ vars.ECS_COMPOSE_PROJECT || 'xitouma-backend' }}
  ECS_PORT: ${{ secrets.ALIYUN_ECS_PORT || '22' }}
  APP_HOST_PORT: ${{ vars.ECS_APP_PORT || '3001' }}
  ACR_WAIT_ATTEMPTS: ${{ vars.ACR_WAIT_ATTEMPTS || '40' }}
  ACR_WAIT_INTERVAL_SEC: ${{ vars.ACR_WAIT_INTERVAL_SEC || '30' }}

jobs:
  resolve-image-tag:
    name: Resolve ACR image tag
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      deploy_source: ${{ steps.resolve.outputs.deploy_source }}
    steps:
      - name: Resolve tag from push or input
        id: resolve
        env:
          DISPATCH_TAG: ${{ inputs.image_tag }}
          OVERRIDE_TAG: ${{ vars.ACR_IMAGE_TAG }}
          MAIN_TAG: ${{ vars.ACR_MAIN_IMAGE_TAG }}
          RELEASE_TAG_MODE: ${{ vars.ACR_RELEASE_TAG_MODE }}
        run: |
          set -euo pipefail

          if [ -n "${DISPATCH_TAG}" ]; then
            tag="${DISPATCH_TAG}"
            source="workflow_dispatch"
          elif [[ "${GITHUB_REF}" == refs/tags/release-v* ]]; then
            ref_name="${GITHUB_REF_NAME}"
            mode="${RELEASE_TAG_MODE:-version}"
            case "$mode" in
              full)
                tag="${ref_name}"
                ;;
              version|*)
                tag="${ref_name#release-v}"
                if [ -z "$tag" ]; then
                  echo "Git tag ${ref_name} does not contain a version after release-v"
                  exit 1
                fi
                ;;
            esac
            source="release_tag"
          elif [[ "${GITHUB_REF}" == refs/heads/main || "${GITHUB_REF}" == refs/heads/master ]]; then
            if [ -n "${MAIN_TAG}" ]; then
              tag="${MAIN_TAG}"
            elif [ -n "${OVERRIDE_TAG}" ]; then
              tag="${OVERRIDE_TAG}"
            else
              tag="latest"
            fi
            source="main_branch"
          else
            echo "Unsupported ref for deploy: ${GITHUB_REF}"
            exit 1
          fi

          echo "Resolved IMAGE_TAG=${tag} (source=${source}, ref=${GITHUB_REF})"
          echo "image_tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "deploy_source=${source}" >> "$GITHUB_OUTPUT"

  wait-for-acr-image:
    name: Wait for ACR image
    needs: resolve-image-tag
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ needs.resolve-image-tag.outputs.image_tag }}

    steps:
      - name: Validate ACR credentials
        run: |
          test -n "${{ secrets.ACR_USERNAME }}" || (echo "Missing secret: ACR_USERNAME" && exit 1)
          test -n "${{ secrets.ACR_PASSWORD }}" || (echo "Missing secret: ACR_PASSWORD" && exit 1)

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Wait until image tag exists
        env:
          DEPLOY_SOURCE: ${{ needs.resolve-image-tag.outputs.deploy_source }}
        run: |
          image="${ACR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          attempts="${ACR_WAIT_ATTEMPTS}"
          interval="${ACR_WAIT_INTERVAL_SEC}"

          echo "Deploy source: ${DEPLOY_SOURCE}"
          echo "Waiting for ACR auto-build to publish: ${image}"
          echo "Attempts: ${attempts}, interval: ${interval}s"

          if [ "$DEPLOY_SOURCE" = "main_branch" ] && [ "$IMAGE_TAG" = "latest" ]; then
            echo "::warning::Waiting for :latest cannot detect a new build vs an old image. Prefer unique release tags or set ACR_MAIN_IMAGE_TAG to a fixed tag other than latest."
          fi

          for attempt in $(seq 1 "$attempts"); do
            if docker manifest inspect "$image" >/dev/null 2>&1; then
              echo "Image is ready (attempt ${attempt}/${attempts})"
              exit 0
            fi
            echo "Not ready yet (${attempt}/${attempts})..."
            sleep "$interval"
          done

          echo "Timed out waiting for ${image}"
          echo "Check ACR build logs; tag must match ACR rule (release-v* -> \$version, main -> ACR_MAIN_IMAGE_TAG / latest)."
          exit 1

  deploy:
    name: Deploy to ECS
    needs:
      - resolve-image-tag
      - wait-for-acr-image
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ needs.resolve-image-tag.outputs.image_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate deployment configuration
        env:
          ECS_ENV_PRODUCTION: ${{ secrets.ECS_ENV_PRODUCTION }}
          ALIYUN_ECS_HOST: ${{ secrets.ALIYUN_ECS_HOST }}
          ALIYUN_ECS_USER: ${{ secrets.ALIYUN_ECS_USER }}
          ALIYUN_ECS_SSH_KEY: ${{ secrets.ALIYUN_ECS_SSH_KEY }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WECHAT_SECRET: ${{ secrets.WECHAT_SECRET }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          WECHAT_APPID: ${{ vars.WECHAT_APPID }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
        run: |
          missing=()

          test -n "$ALIYUN_ECS_HOST" || missing+=("Secret: ALIYUN_ECS_HOST")
          test -n "$ALIYUN_ECS_USER" || missing+=("Secret: ALIYUN_ECS_USER")
          test -n "$ALIYUN_ECS_SSH_KEY" || missing+=("Secret: ALIYUN_ECS_SSH_KEY")

          if [ -z "$ECS_ENV_PRODUCTION" ]; then
            test -n "$POSTGRES_PASSWORD" || missing+=("Secret: POSTGRES_PASSWORD")
            test -n "$JWT_SECRET" || missing+=("Secret: JWT_SECRET")
            test -n "$WECHAT_SECRET" || missing+=("Secret: WECHAT_SECRET")
            test -n "$POSTGRES_USER" || missing+=("Variable: POSTGRES_USER")
            test -n "$POSTGRES_DB" || missing+=("Variable: POSTGRES_DB")
            test -n "$WECHAT_APPID" || missing+=("Variable: WECHAT_APPID")
            test -n "$CORS_ORIGIN" || missing+=("Variable: CORS_ORIGIN")
          fi

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing GitHub Actions configuration:"
            printf '  - %s\n' "${missing[@]}"
            exit 1
          fi

      - name: Prepare SSH
        env:
          ALIYUN_ECS_HOST: ${{ secrets.ALIYUN_ECS_HOST }}
          ALIYUN_ECS_USER: ${{ secrets.ALIYUN_ECS_USER }}
          ALIYUN_ECS_SSH_KEY: ${{ secrets.ALIYUN_ECS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$ALIYUN_ECS_SSH_KEY" > ~/.ssh/aliyun_ecs
          sed -i 's/\r$//' ~/.ssh/aliyun_ecs
          chmod 600 ~/.ssh/aliyun_ecs
          ssh-keygen -y -f ~/.ssh/aliyun_ecs > /tmp/aliyun_ecs.pub
          ssh-keygen -lf /tmp/aliyun_ecs.pub
          ssh-keyscan -p "$ECS_PORT" -H "$ALIYUN_ECS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Test SSH connection
        env:
          ALIYUN_ECS_HOST: ${{ secrets.ALIYUN_ECS_HOST }}
          ALIYUN_ECS_USER: ${{ secrets.ALIYUN_ECS_USER }}
        run: |
          ssh -i ~/.ssh/aliyun_ecs -p "$ECS_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            "$ALIYUN_ECS_USER@$ALIYUN_ECS_HOST" "echo ssh-ok && mkdir -p '$DEPLOY_PATH'"

      - name: Write production env
        env:
          ECS_ENV_PRODUCTION: ${{ secrets.ECS_ENV_PRODUCTION }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          WECHAT_SECRET: ${{ secrets.WECHAT_SECRET }}
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          WECHAT_APPID: ${{ vars.WECHAT_APPID }}
          WECHAT_JSCODE2SESSION_URL: ${{ vars.WECHAT_JSCODE2SESSION_URL }}
          DEFAULT_TIMEZONE: ${{ vars.DEFAULT_TIMEZONE }}
          BACKFILL_WINDOW_DAYS: ${{ vars.BACKFILL_WINDOW_DAYS }}
          CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
          POSTGRES_HOST: ${{ vars.POSTGRES_HOST }}
        run: node scripts/render-production-env.mjs /tmp/.env.production

      - name: Upload compose and env
        env:
          ALIYUN_ECS_HOST: ${{ secrets.ALIYUN_ECS_HOST }}
          ALIYUN_ECS_USER: ${{ secrets.ALIYUN_ECS_USER }}
        run: |
          scp -i ~/.ssh/aliyun_ecs -P "$ECS_PORT" docker-compose.prod.yml \
            "$ALIYUN_ECS_USER@$ALIYUN_ECS_HOST:$DEPLOY_PATH/docker-compose.prod.yml"
          scp -i ~/.ssh/aliyun_ecs -P "$ECS_PORT" /tmp/.env.production \
            "$ALIYUN_ECS_USER@$ALIYUN_ECS_HOST:$DEPLOY_PATH/.env.production"

      - name: Log in to ACR on ECS
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          ALIYUN_ECS_HOST: ${{ secrets.ALIYUN_ECS_HOST }}
          ALIYUN_ECS_USER: ${{ secrets.ALIYUN_ECS_USER }}
        run: |
          test -n "$ACR_USERNAME" || (echo "Missing secret: ACR_USERNAME" && exit 1)
          test -n "$ACR_PASSWORD" || (echo "Missing secret: ACR_PASSWORD" && exit 1)

          printf '%s' "$ACR_PASSWORD" | ssh -i ~/.ssh/aliyun_ecs -p "$ECS_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            "$ALIYUN_ECS_USER@$ALIYUN_ECS_HOST" \
            "docker login '$ACR_REGISTRY' -u '$ACR_USERNAME' --password-stdin"

      - name: Deploy on ECS
        env:
          ALIYUN_ECS_HOST: ${{ secrets.ALIYUN_ECS_HOST }}
          ALIYUN_ECS_USER: ${{ secrets.ALIYUN_ECS_USER }}
        run: |
          ssh -i ~/.ssh/aliyun_ecs -p "$ECS_PORT" -o BatchMode=yes -o IdentitiesOnly=yes \
            "$ALIYUN_ECS_USER@$ALIYUN_ECS_HOST" \
            "ACR_REGISTRY='$ACR_REGISTRY' IMAGE_NAME='$IMAGE_NAME' IMAGE_TAG='$IMAGE_TAG' DEPLOY_PATH='$DEPLOY_PATH' COMPOSE_PROJECT_NAME='$COMPOSE_PROJECT_NAME' APP_HOST_PORT='$APP_HOST_PORT' bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          cd "$DEPLOY_PATH"
          export XITOUMA_IMAGE="${ACR_REGISTRY}/${IMAGE_NAME}:${IMAGE_TAG}"
          export APP_HOST_PORT="${APP_HOST_PORT:-3001}"

          docker pull "$XITOUMA_IMAGE"
          APP_HOST_PORT="$APP_HOST_PORT" XITOUMA_IMAGE="$XITOUMA_IMAGE" \
            docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.prod.yml up -d --no-build --remove-orphans
          docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.prod.yml ps

          host_port="${APP_HOST_PORT:-3001}"
          if mapped_port="$(
            docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.prod.yml port app 3000 2>/dev/null \
              | sed 's/.*://'
          )" && [ -n "$mapped_port" ]; then
            host_port="$mapped_port"
          fi
          health_url="http://127.0.0.1:${host_port}/health"
          echo "Waiting for ${health_url} (migrate + app startup)..."

          health_ok=0
          for attempt in $(seq 1 30); do
            if curl -fsS "$health_url" >/dev/null 2>&1; then
              echo "Health check passed (attempt ${attempt}/30)"
              curl -fsS "$health_url"
              health_ok=1
              break
            fi
            echo "Not ready yet (${attempt}/30)..."
            sleep 2
          done

          if [ "$health_ok" -ne 1 ]; then
            echo "Health check failed after 60s"
            docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.prod.yml ps -a
            docker compose -p "$COMPOSE_PROJECT_NAME" -f docker-compose.prod.yml logs --tail 120 app || true
            exit 1
          fi

          docker image prune -f
          REMOTE_SCRIPT
